name: Build S4A Multi-Platform (Windows, macOS, Android)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build Mode (all = full and basic)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - full
          - basic
  push:
    branches: [main, s4a-local]
    paths:
      - "s4a-web/**"
      - ".github/workflows/s4a-windows-build.yml"
  pull_request:
    branches: [main, s4a-local]
    paths:
      - "s4a-web/**"
      - ".github/workflows/s4a-windows-build.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      modes: ${{ steps.modes.outputs.modes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare package.json version
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "release" ]; then
            echo "Manual or release event detected. Forcing build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CURR_VER=$(node -p "try { require('./s4a-web/package.json').version } catch(e) { '' }")
          PREV_VER=$(git show HEAD~1:s4a-web/package.json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).version)}catch(e){console.log('')}})" || echo "")

          echo "Previous version: '$PREV_VER'"
          echo "Current version:  '$CURR_VER'"

          if [ -n "$CURR_VER" ] && [ "$CURR_VER" != "$PREV_VER" ]; then
            echo "Version changed from '$PREV_VER' to '$CURR_VER'. Triggering builds."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged. Skipping builds."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine Target Modes
        id: modes
        shell: bash
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ "$INPUT_MODE" = "full" ]; then
            echo 'modes=["full"]' >> $GITHUB_OUTPUT
          elif [ "$INPUT_MODE" = "basic" ]; then
            echo 'modes=["basic"]' >> $GITHUB_OUTPUT
          else
            echo 'modes=["full","basic"]' >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Build Windows (.exe) [${{ matrix.mode }}]
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        mode: ${{ fromJson(needs.check-version.outputs.modes) }}
      fail-fast: false

    defaults:
      run:
        working-directory: s4a-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: s4a-web/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: s4a-web/src-tauri

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Frontend Tests
        run: npm test -- --run

      - name: Run Rust Tests
        working-directory: s4a-web/src-tauri
        run: cargo test

      - name: Build Tauri Windows Release (.exe) [${{ matrix.mode }}]
        env:
          VITE_BUILD_MODE: ${{ matrix.mode }}
        run: npm run tauri:build:${{ matrix.mode }}

      - name: Package Windows EXE [${{ matrix.mode }}]
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MODE="${{ matrix.mode }}"
          echo "Packaging Windows EXE for version $VERSION ($MODE mode)"

          EXE_PATH=""
          if [ -f "src-tauri/target/release/s4a-app.exe" ]; then
            EXE_PATH="src-tauri/target/release/s4a-app.exe"
          elif [ -f "src-tauri/target/release/app.exe" ]; then
            EXE_PATH="src-tauri/target/release/app.exe"
          elif [ -f "src-tauri/target/release/s4a-web.exe" ]; then
            EXE_PATH="src-tauri/target/release/s4a-web.exe"
          else
            EXE_PATH=$(ls src-tauri/target/release/*.exe 2>/dev/null | grep -v -i "installer" | grep -v -i "setup" | head -n 1)
          fi

          mkdir -p dist-packages
          DEST_NAME="s4a-app_${VERSION}_${MODE}_x64.exe"
          cp "$EXE_PATH" "dist-packages/$DEST_NAME"
          echo "Created dist-packages/$DEST_NAME"
          ls -lh dist-packages/

      - name: Upload Windows Standalone EXE [${{ matrix.mode }}]
        uses: actions/upload-artifact@v4
        with:
          name: S4A-Windows-EXE-${{ matrix.mode }}
          path: s4a-web/dist-packages/s4a-app_*_${{ matrix.mode }}_x64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (.dmg) [${{ matrix.mode }}]
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        mode: ${{ fromJson(needs.check-version.outputs.modes) }}
      fail-fast: false

    defaults:
      run:
        working-directory: s4a-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: s4a-web/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: s4a-web/src-tauri

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Frontend Tests
        run: npm test -- --run

      - name: Run Rust Tests
        working-directory: s4a-web/src-tauri
        run: cargo test

      - name: Build Tauri macOS Release [${{ matrix.mode }}]
        env:
          VITE_BUILD_MODE: ${{ matrix.mode }}
        run: npm run tauri:build:${{ matrix.mode }}

      - name: Package macOS DMG [${{ matrix.mode }}]
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MODE="${{ matrix.mode }}"
          echo "Packaging macOS DMG for version $VERSION ($MODE mode)"
          mkdir -p dist-packages
          DMG_SRC=$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -n 1)
          DEST_NAME="s4a-app_${VERSION}_${MODE}.dmg"
          cp "$DMG_SRC" "dist-packages/$DEST_NAME"
          echo "Created dist-packages/$DEST_NAME"
          ls -lh dist-packages/

      - name: Upload macOS DMG [${{ matrix.mode }}]
        uses: actions/upload-artifact@v4
        with:
          name: S4A-macOS-DMG-${{ matrix.mode }}
          path: s4a-web/dist-packages/s4a-app_*_${{ matrix.mode }}.dmg
          if-no-files-found: error

  build-android:
    name: Build Android (.apk) [${{ matrix.mode }}]
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: ${{ fromJson(needs.check-version.outputs.modes) }}
      fail-fast: false

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358

    defaults:
      run:
        working-directory: s4a-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: s4a-web/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK Licenses and NDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          echo "Found sdkmanager at: $SDKMANAGER"

          SDK_BIN_DIR=$(dirname "$SDKMANAGER")
          echo "$SDK_BIN_DIR" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358" "platform-tools"

      - name: Setup Rust toolchain with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: s4a-web/src-tauri

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android APK [${{ matrix.mode }}]
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          VITE_BUILD_MODE: ${{ matrix.mode }}
        run: npm run tauri:android:build:debug

      - name: Package Android APK [${{ matrix.mode }}]
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MODE="${{ matrix.mode }}"
          echo "Packaging Android APK for version $VERSION ($MODE mode)"
          mkdir -p dist-packages
          APK_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          DEST_NAME="s4a-app_${VERSION}_${MODE}.apk"
          cp "$APK_SRC" "dist-packages/$DEST_NAME"
          echo "Created dist-packages/$DEST_NAME"
          ls -lh dist-packages/

      - name: Upload Android APK [${{ matrix.mode }}]
        uses: actions/upload-artifact@v4
        with:
          name: S4A-Android-APK-${{ matrix.mode }}
          path: s4a-web/dist-packages/s4a-app_*_${{ matrix.mode }}.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (6 Packages)
    needs: [check-version, build-windows, build-macos, build-android]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Collect 6 Final Packages
        run: |
          mkdir -p final-packages
          find release-artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.apk" \) -exec cp {} final-packages/ \;
          echo "=== 6 Packages ready for release ==="
          ls -lh final-packages/

      - name: Upload 6 Packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-packages/*
