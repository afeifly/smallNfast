name: Build S4A Multi-Platform (Windows, macOS, Android)

on:
  workflow_dispatch:
  push:
    branches: [main, s4a-local]
    paths:
      - "s4a-web/**"
      - ".github/workflows/s4a-windows-build.yml"
  pull_request:
    branches: [main, s4a-local]
    paths:
      - "s4a-web/**"
      - ".github/workflows/s4a-windows-build.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release (.exe)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: s4a-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: s4a-web/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: s4a-web/src-tauri

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Frontend Tests
        run: npm test -- --run

      - name: Run Rust Tests
        working-directory: s4a-web/src-tauri
        run: cargo test

      - name: Build Web Application
        run: npm run build

      - name: Build Tauri Windows Release (.exe and installers)
        run: npm run tauri:build

      - name: Locate and Package Versioned Artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Packaging Windows artifacts for version $VERSION"

          EXE_PATH=""
          if [ -f "src-tauri/target/release/s4a-app.exe" ]; then
            EXE_PATH="src-tauri/target/release/s4a-app.exe"
          elif [ -f "src-tauri/target/release/app.exe" ]; then
            EXE_PATH="src-tauri/target/release/app.exe"
          elif [ -f "src-tauri/target/release/s4a-web.exe" ]; then
            EXE_PATH="src-tauri/target/release/s4a-web.exe"
          else
            EXE_PATH=$(ls src-tauri/target/release/*.exe 2>/dev/null | grep -v -i "installer" | grep -v -i "setup" | head -n 1)
          fi

          mkdir -p dist-packages
          cp "$EXE_PATH" "dist-packages/s4a-app_${VERSION}_x64.exe"
          cp "$EXE_PATH" "dist-packages/s4a-app.exe"

          cd dist-packages
          if command -v 7z &>/dev/null; then
            7z a -tzip "../s4a-app_${VERSION}_windows_x64.zip" "s4a-app_${VERSION}_x64.exe"
          else
            powershell.exe -Command "Compress-Archive -Path s4a-app__x64.exe -DestinationPath ../s4a-app__windows_x64.zip -Force"
          fi
          cd ..

          ls -lh dist-packages/
          ls -lh s4a-app_${VERSION}_windows_x64.zip

      - name: Upload Versioned Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: S4A-Windows-Portable-ZIP
          path: s4a-web/s4a-app_*_windows_x64.zip
          if-no-files-found: error

      - name: Upload Versioned Windows Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: S4A-Windows-EXE
          path: s4a-web/dist-packages/s4a-app_*_x64.exe
          if-no-files-found: error

      - name: Upload Windows Installers (NSIS / MSI)
        uses: actions/upload-artifact@v4
        with:
          name: S4A-Windows-Installers
          path: |
            s4a-web/src-tauri/target/release/bundle/nsis/*.exe
            s4a-web/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows Assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            s4a-web/s4a-app_*_windows_x64.zip
            s4a-web/dist-packages/s4a-app_*_x64.exe
            s4a-web/src-tauri/target/release/bundle/nsis/*.exe
            s4a-web/src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS Release (.dmg)
    runs-on: macos-latest

    defaults:
      run:
        working-directory: s4a-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: s4a-web/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: s4a-web/src-tauri

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Frontend Tests
        run: npm test -- --run

      - name: Run Rust Tests
        working-directory: s4a-web/src-tauri
        run: cargo test

      - name: Build Web Application
        run: npm run build

      - name: Build Tauri macOS Release
        run: npm run tauri:build

      - name: Package Versioned macOS Artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Packaging macOS artifacts for version $VERSION"
          mkdir -p dist-packages
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-packages/

          echo "Verifying macOS app bundle code signature:"
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/s4a-app.app

          echo "Creating portable versioned macOS ZIP:"
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent s4a-app.app "../../../../dist-packages/s4a-app_${VERSION}_macos.zip"
          cd ../../../..

          ls -la dist-packages/

      - name: Upload Versioned macOS DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: S4A-macOS-DMG
          path: s4a-web/dist-packages/*.dmg
          if-no-files-found: error

      - name: Upload Versioned macOS Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: S4A-macOS-Portable-ZIP
          path: s4a-web/dist-packages/*.zip
          if-no-files-found: warn

      - name: Upload macOS Assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            s4a-web/dist-packages/*.dmg
            s4a-web/dist-packages/*.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358

    defaults:
      run:
        working-directory: s4a-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: s4a-web/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK Licenses and NDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          echo "Found sdkmanager at: $SDKMANAGER"

          SDK_BIN_DIR=$(dirname "$SDKMANAGER")
          echo "$SDK_BIN_DIR" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

          yes | "$SDKMANAGER" --licenses || true
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358" "platform-tools"

      - name: Setup Rust toolchain with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: s4a-web/src-tauri

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: npm run tauri:android:build:debug

      - name: Package Versioned Android APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Packaging Android APK for version $VERSION"
          mkdir -p dist-packages
          APK_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_SRC" "dist-packages/s4a-app_${VERSION}_android.apk"
          ls -la dist-packages/

      - name: Upload Versioned Android APK
        uses: actions/upload-artifact@v4
        with:
          name: S4A-Android-APK
          path: s4a-web/dist-packages/s4a-app_*_android.apk
          if-no-files-found: error

      - name: Upload Android Assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            s4a-web/dist-packages/s4a-app_*_android.apk
