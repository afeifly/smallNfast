<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ST Label Print - Standalone Demo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<style>
    .suto-st-label-preview {
        max-width: 140px;
        max-height: 140px;
        object-fit: contain;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        background: #fff;
        padding: 2px;
        cursor: zoom-in;
    }
    .suto-st-label-response { font-size: .875rem; }
    .suto-st-label-response table { font-size: .875rem; }
</style>
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 720px;">
    <div class="card">
        <div class="card-header bg-white">
            <h5 class="mb-0">Product</h5>
        </div>
        <div class="card-body">
            <form id="product-form" onsubmit="event.preventDefault(); printST();">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">API base (label server)</label>
                        <input id="api-base" class="form-control" value="http://localhost:5005" placeholder="http://localhost:5005"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Product</label>
                        <input id="product" class="form-control" value="S695 4120"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Serial numbers (comma separated)</label>
                        <input id="serials" class="form-control" value="2726 8785, 2726 8786"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Options</label>
                        <input id="options" class="form-control" value="A1003, A1010, A1323, A1409, A1410, A1420, A1426"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Language (lang)</label>
                        <input id="lang" class="form-control" value="zh"/>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary" id="print-st-btn">Print ST</button>
                    </div>
                    <div id="form-error" class="col-12"></div>
                </div>
            </form>
        </div>
    </div>
<p class="text-muted small mt-3 mb-0">
    Standalone "Print ST" simulator. On load it POSTs the same payload as
    <code>curl -X POST {api-base}/st_label</code>, then shows the
    <strong>ST Label Response</strong> dialog (widget) exactly as Odoo would.
    If the label server is unreachable, it falls back to embedded sample data.
</p>
</div>

<!-- ===== ST Label Response dialog (mirrors views/st_label_response_wizard.xml + widget) ===== -->
<div class="modal fade" id="stLabelDialog" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">ST Label Response</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3 mb-3">
                    <div class="col-md-4"><label class="form-label">Product</label><input class="form-control" id="w-product" readonly/></div>
                    <div class="col-md-4"><label class="form-label">Options</label><input class="form-control" id="w-options" readonly/></div>
                    <div class="col-md-4"><label class="form-label">Device</label><input class="form-control" id="w-device" readonly/></div>
                    <div class="col-md-4"><label class="form-label">Total serials</label><input class="form-control" id="w-total" readonly/></div>
                    <div class="col-md-8 d-flex align-items-end gap-2">
                        <div class="flex-grow-1">
                            <label class="form-label">Print service URL</label>
                            <input id="w-service-url" class="form-control" placeholder="http://192.168.x.x:8799/print" value="http://100.100.1.11:8799/print"/>
                        </div>
                        <button class="btn btn-secondary" id="w-check-service">Check service</button>
                    </div>
                </div>
                <hr/>
                <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
                    <span class="text-muted"><span id="w-summary"></span></span>
                    <button class="btn btn-primary" id="w-print-all" disabled>Print all labels</button>
                </div>
                <div id="w-templates"></div>
                <div id="w-status"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== Preview dialog ===== -->
<div class="modal fade" id="previewDialog" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Label Preview</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center p-3">
                <img id="preview-img" class="img-fluid" alt="preview"/>
                <p id="preview-serial" class="mt-2 mb-0 text-muted"></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ===== Config: API base of the label server (edit the input in the page to switch) =====
const DEFAULT_API_BASE = "http://localhost:5005"; // e.g. https://acbarcode.suto-portal.com
// =======================================================================================

function getApiBase() {
    return (document.getElementById("api-base").value || DEFAULT_API_BASE).trim().replace(/\/+$/, "");
}

// Fallback data = real st_label response from the server
const SAMPLE_RESPONSE = {
    "product": "S695 4120",
    "lang": "zh",
    "done_date": "2026-07-07 03:59:23",
    "serial_numbers": [
        "2726 8785",
        "2726 8786"
    ],
    "options": [
        "A1003",
        "A1010",
        "A1323",
        "A1409",
        "A1410",
        "A1420",
        "A1426"
    ],
    "format": "json"
};

const stDialog = new bootstrap.Modal(document.getElementById("stLabelDialog"));
const previewDialog = new bootstrap.Modal(document.getElementById("previewDialog"));
const statusEl = document.getElementById("w-status");

function setStatus(msg, isError) {
    statusEl.innerHTML = msg
        ? `<div class="alert mt-2 ${isError ? "alert-danger" : "alert-success"}" role="alert">${msg}</div>`
        : "";
}

function templateConfig(tpl) {
    return (tpl && tpl.config) || SAMPLE_RESPONSE.config || {};
}

function showPreview(item) {
    if (!item.preview_image) return;
    document.getElementById("preview-img").src = item.preview_image;
    document.getElementById("preview-serial").textContent = item.serial || "";
    previewDialog.show();
}

async function sendViaBridge(commands) {
    const url = (document.getElementById("w-service-url").value || "").trim();
    if (!url) {
        setStatus("Set the Print service URL above, then Check service.", true);
        return;
    }
    setStatus("");
    try {
        const resp = await fetch("/suto_st_label/print", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, ezpl_list: commands }),
        });
        const data = await resp.json();
        if (data.ok) {
            setStatus(`Sent ${commands.length} label(s) to printer (${url}).`);
        } else {
            setStatus(`Print failed: ${data.error || "unknown error"}`, true);
        }
    } catch (e) {
        setStatus(`Print failed: ${e.message}`, true);
    }
}

function renderTemplates(data) {
    const box = document.getElementById("w-templates");
    box.innerHTML = "";
    const templates = data.templates || [];
    document.getElementById("w-print-all").disabled = !templates.length;
    if (!templates.length) {
        box.innerHTML = '<div class="alert alert-warning">No templates in response.</div>';
        return;
    }

    function makeButton(label, cls, onClick) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = cls;
        b.textContent = label;
        b.addEventListener("click", onClick);
        return b;
    }

    for (const tpl of templates) {
        const cfg = templateConfig(tpl);
        const items = tpl.items || [];

        const div = document.createElement("div");
        div.className = "suto-st-label-template border rounded mb-3 p-2";

        const head = document.createElement("div");
        head.className = "d-flex align-items-center mb-2";

        const h = document.createElement("h6");
        h.className = "mb-0 me-2";
        h.textContent = tpl.name || "";
        head.appendChild(h);

        const badge = document.createElement("span");
        badge.className = "badge text-bg-secondary me-auto";
        badge.textContent = tpl.type || "";
        head.appendChild(badge);

        const meta = document.createElement("span");
        meta.className = "text-muted me-2";
        meta.textContent =
            `${cfg.widthMm}×${cfg.heightMm}mm @ ${cfg.dpi}dpi · ${tpl.total_labels} labels`;
        head.appendChild(meta);

        head.appendChild(makeButton(
            "Print template",
            "btn btn-outline-primary btn-sm",
            () => sendViaBridge(items.map(i => i.ezpl)),
        ));
        div.appendChild(head);

        const table = document.createElement("table");
        table.className = "table table-sm table-striped mb-1";
        table.innerHTML = "<thead><tr><th>Serial</th><th class=\"w-25\">Preview</th><th class=\"w-10\"></th></tr></thead>";
        const tbody = document.createElement("tbody");
        for (const item of items) {
            const tr = document.createElement("tr");

            const tdSerial = document.createElement("td");
            tdSerial.className = "align-top";
            tdSerial.textContent = item.serial || "";
            tr.appendChild(tdSerial);

            const tdPrev = document.createElement("td");
            tdPrev.className = "align-top";
            if (item.preview_image) {
                const a = document.createElement("a");
                a.href = "#";
                a.className = "d-inline-block";
                a.addEventListener("click", (ev) => { ev.preventDefault(); showPreview(item); });
                const img = document.createElement("img");
                img.src = item.preview_image;
                img.alt = "Preview " + (item.serial || "");
                img.className = "suto-st-label-preview";
                a.appendChild(img);
                tdPrev.appendChild(a);
            } else {
                const span = document.createElement("span");
                span.className = "text-muted small";
                span.textContent = "(no preview)";
                tdPrev.appendChild(span);
            }
            tr.appendChild(tdPrev);

            const tdBtn = document.createElement("td");
            tdBtn.className = "align-top text-end";
            tdBtn.appendChild(makeButton("Print", "btn btn-primary btn-sm", () => sendViaBridge([item.ezpl])));
            tr.appendChild(tdBtn);

            tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        div.appendChild(table);

        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.className = "text-muted";
        summary.textContent = "Show EZPL commands";
        details.appendChild(summary);
        const pre = document.createElement("pre");
        pre.className = "mb-0 bg-light p-2 mt-2";
        pre.textContent = tpl.all_ezpl || "";
        details.appendChild(pre);
        div.appendChild(details);

        box.appendChild(div);
    }
}

function showDialog(data) {
    const cfg = templateConfig(data.templates && data.templates[0]);
    const serials = data.serial_numbers || [];
    document.getElementById("w-product").value = data.product || "";
    document.getElementById("w-options").value = Array.isArray(data.options) ? data.options.join(", ") : data.options || "";
    document.getElementById("w-device").value = data.device_name || "";
    document.getElementById("w-total").value = data.total_serials ?? serials.length ?? 0;
    document.getElementById("w-summary").textContent =
        `${data.product || ""} · ${data.device_name || ""} · ${data.total_serials ?? serials.length ?? 0} serials`;
    setStatus("");
    renderTemplates(data);
    stDialog.show();
}

async function printST() {
    const payload = buildPayload();
    await fetchAndShow(payload);
}

async function initDemo() {
    const payload = buildPayload();
    const errEl = document.getElementById("form-error");
    errEl.innerHTML = "";
    try {
        const data = await postToServer(payload);
        document.getElementById("product").value = data.product || payload.product;
        document.getElementById("serials").value = (data.serial_numbers || []).join(", ") || document.getElementById("serials").value;
        if (data.options && data.options.length) {
            document.getElementById("options").value = data.options.join(", ");
        }
        document.getElementById("lang").value = data.lang || payload.lang;
        showDialog(data);
    } catch (e) {
        console.warn("st_label unreachable on init, using sample data:", e.message);
        errEl.innerHTML =
            `<div class="alert alert-warning">st_label unreachable (${e.message}). Showing embedded sample response so you can view the dialog.</div>`;
        showDialog(SAMPLE_RESPONSE);
    }
}

function buildPayload() {
    return {
        "product": document.getElementById("product").value,
        "serial_numbers": document.getElementById("serials").value.split(",").map(s => s.trim()).filter(Boolean),
        "options": document.getElementById("options").value.split(",").map(s => s.trim()).filter(Boolean),
        "lang": document.getElementById("lang").value || "cn",
        "format": "json",
    };
}

async function postToServer(payload) {
    const resp = await fetch(getApiBase() + "/st_label", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
    });
    if (!resp.ok) {
        throw new Error(`Label server returned HTTP ${resp.status}: ${(await resp.text()).slice(0, 300)}`);
    }
    return await resp.json();
}

async function fetchAndShow(payload) {
    const btn = document.getElementById("print-st-btn");
    const errEl = document.getElementById("form-error");
    btn.disabled = true;
    btn.textContent = "Requesting labels...";
    errEl.innerHTML = "";
    try {
        const data = await postToServer(payload);
        showDialog(data);
    } catch (e) {
        console.warn("Label server unreachable, using sample data:", e.message);
        errEl.innerHTML =
            `<div class="alert alert-warning">Label server unreachable (${e.message}). Showing embedded sample response so you can view the dialog.</div>`;
        showDialog(SAMPLE_RESPONSE);
    } finally {
        btn.disabled = false;
        btn.textContent = "Print ST";
    }
}

document.getElementById("w-check-service").addEventListener("click", async () => {
    const url = (document.getElementById("w-service-url").value || "").trim().replace(/\/+$/, "");
    if (!url) { setStatus("Set the Print service URL first, e.g. http://192.168.x.x:8799", true); return; }
    setStatus("Checking service...");
    try {
        const resp = await fetch(url + "/health", { method: "GET" });
        const data = await resp.json();
        if (resp.ok) {
            const printers = (data.printers || []).map(p => "- " + p).join("\n") || "(none)";
            setStatus(`Print service is running.\nDefault printer: ${data.default_printer || "?"}\nAvailable printers:\n${printers}`);
        } else {
            setStatus(`Health check returned HTTP ${resp.status}: ${(await resp.text()).slice(0, 300)}`, true);
        }
    } catch (e) {
        setStatus(`Cannot reach the print service at ${url}. Error: ${e.message}`, true);
    }
});

initDemo();
</script>
</body>
</html>
