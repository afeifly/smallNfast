<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- S4A Signature Brand Yellow Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff152" />
      <stop offset="35%" stop-color="#ffe000" />
      <stop offset="100%" stop-color="#f5d300" />
    </linearGradient>

    <!-- Subtle Premium Glass Rim -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#cca800" stop-opacity="0.4" />
    </linearGradient>

    <!-- Web App Signature Logo Teal Gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ac86" />
      <stop offset="100%" stop-color="#007d61" />
    </linearGradient>

    <!-- Drop Shadow for Trendline -->
    <filter id="line-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#00382a" flood-opacity="0.25" />
    </filter>

    <!-- App Icon Base Shadow -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas (Matches Apple HIG / Modern Android Squircle) -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg-grad)" filter="url(#icon-shadow)" />
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="none" stroke="url(#rim-grad)" stroke-width="12" />

  <!-- Web Icon Signature Path: M3 17l6-6 4 4 8-8 (Scaled & Perfectly Centered on 1024x1024) -->
  <path
    d="M 180 720 L 420 480 L 580 640 L 860 260"
    fill="none"
    stroke="url(#logo-grad)"
    stroke-width="104"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#line-shadow)"
  />
</svg>
